<!-- The personal note near the foot of the home page. Portrait on one side, a short
     run of paragraphs on the other, then a link through to the full about page. -->
<section class="bio {{ band }}" data-section="bio" data-reveal>
  <div class="shell bio__layout">
    <div class="bio__figure">
      {{#if section.portrait}}
      <img src="{{ section.portrait.src }}" srcset="{{ section.portrait.srcSet }}"
           sizes="(min-width: 55rem) 26rem, 84vw"
           alt="{{ section.portrait.alt }}" width="1078" height="1078" loading="lazy" decoding="async">
      {{else}}
      <div class="placeholder" role="img" aria-label="{{ section.heading }}">
        <span>{{ strings.ui.imageComingSoon }}</span>
      </div>
      {{/if}}
    </div>

    <div class="bio__copy">
      <h2>{{ section.heading }}</h2>
      {{#if section.lead}}<p class="bio__lead">{{ section.lead }}</p>{{/if}}
      {{#each section.body}}
      <p>{{ this }}</p>
      {{/each}}
      {{#if section.cta}}
      <p class="bio__more"><a class="link-more" href="{{ section.cta.url }}">{{ section.cta.label }}</a></p>
      {{/if}}
    </div>
  </div>
</section>
