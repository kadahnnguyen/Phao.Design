<section class="strengths {{ band }}" data-section="strengths" data-reveal>
  <div class="shell">
    <header class="section-head">
      <h2>{{ section.heading }}</h2>
    </header>

    <ol class="strengths__list">
      {{#each section.items}}
      <li class="strength">
        <h3 class="strength__title">{{ this.title }}</h3>
        <p class="strength__body">{{ this.body }}</p>
      </li>
      {{/each}}
    </ol>
  </div>
</section>
