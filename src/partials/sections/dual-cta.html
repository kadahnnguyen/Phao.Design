<section class="dual-cta {{ band }}" data-section="dual-cta" data-reveal>
  <div class="shell dual-cta__grid">
    <a class="cta cta--primary" href="{{ section.primary.url }}">
      <span class="cta__label">{{ section.primary.label }}</span>
      <span class="cta__note">{{ section.primary.note }}</span>
    </a>
    <a class="cta cta--secondary" href="{{ section.secondary.url }}">
      <span class="cta__label">{{ section.secondary.label }}</span>
      <span class="cta__note">{{ section.secondary.note }}</span>
    </a>
  </div>
</section>
