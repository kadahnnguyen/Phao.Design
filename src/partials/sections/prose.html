<section class="prose {{ band }}" data-section="prose" data-reveal>
  <div class="shell">
    {{#if section.heading}}
    <header class="section-head">
      <h2>{{ section.heading }}</h2>
    </header>
    {{/if}}

    <div class="prose__body">
      {{#each section.body}}
      <p>{{ this }}</p>
      {{/each}}
    </div>

    {{#if section.portrait}}
    <figure class="prose__portrait">
      {{#if section.portrait.src}}
      <img src="{{ section.portrait.src }}" srcset="{{ section.portrait.srcSet }}"
           sizes="(min-width: 55rem) 20rem, 100vw"
           alt="{{ section.portrait.alt }}" width="1078" height="538" loading="lazy">
      {{else}}
      <div class="placeholder" role="img" aria-label="{{ section.portrait.alt }}">
        <span>{{ strings.ui.imageComingSoon }}</span>
      </div>
      {{/if}}
    </figure>
    {{/if}}
  </div>
</section>
